:root{--orange:#E06428;--plum:#803689;--raspberry:#AB2359}
html,body{margin:0;height:100%}
body{min-height:100vh;background:radial-gradient(120% 90% at 78% 8%,#0d3d52 0%,#032637 58%,#021b28 100%);display:flex;align-items:center;justify-content:center;cursor:pointer;font-family:system-ui,sans-serif}
.mark{width:min(72vw,72vh)}
.cL{fill:var(--orange);stroke:var(--orange);stroke-width:6}
.cR{fill:var(--plum);stroke:var(--plum);stroke-width:6}
.cC{fill:none;stroke:var(--raspberry);stroke-width:6}
.resist{fill:none;stroke:#9fb7c0;stroke-width:3;stroke-linecap:round}
.glow{fill:#7fd0d8}
.mk-label{fill:#eaf1f3;font-size:14px;font-weight:400;letter-spacing:.02em;font-family:'Varela Round',"Arial Rounded MT Bold",ui-rounded,"Trebuchet MS","Helvetica Neue",Arial,sans-serif}
.mk-sub{fill:#9fb7c0;font-size:10px;font-weight:400;letter-spacing:.03em;font-family:'Varela Round',"Arial Rounded MT Bold",ui-rounded,"Trebuchet MS","Helvetica Neue",Arial,sans-serif}
.wm{fill:#eaf1f3;font-size:40px;font-weight:400;font-family:'Varela Round',"Arial Rounded MT Bold",ui-rounded,"Trebuchet MS","Helvetica Neue",Arial,sans-serif}
.anim .gL{animation:ballX 8s linear 0s forwards}
.anim .gLb{animation:ballY 8s linear 0s forwards}
.anim .cL{fill-opacity:1;animation:fillFade 1.4s ease 10.3s forwards}
.anim .gR{transform:translateY(28px);animation:resRise 1.6s cubic-bezier(.3,1.35,.5,1) 8.6s forwards}
.anim .cR{opacity:0;transform-box:fill-box;transform-origin:center;animation:resIn 1.6s ease 8.6s forwards, fillFade 1.4s ease 10.6s forwards}
.anim .resist{opacity:0;animation:resistPulse 1.6s ease 8.4s forwards}
.anim .glow{opacity:0;animation:glowPulse 2.1s ease 10s forwards}
.anim .cC{opacity:0;transform-box:fill-box;transform-origin:center;animation:cultureGrow 1.6s ease 11.4s forwards}
.anim .lab-group{opacity:0;animation:fadeIn 1.3s ease 12.8s forwards}
.anim .diagram{animation:diagramOut 1.4s ease 16.1s forwards}
.logo{opacity:0}
.anim .logo{transform-box:fill-box;transform-origin:center;animation:logoIn 1.7s ease 16.1s forwards}
@keyframes ballX{0%{transform:translateX(-230px)}21%{transform:translateX(-120px)}53%{transform:translateX(-60px)}76%{transform:translateX(-25px)}91%{transform:translateX(-8px)}100%{transform:translateX(0)}}
@keyframes ballY{0%{transform:translateY(-175px);animation-timing-function:cubic-bezier(.55,0,.85,.36)}21%{transform:translateY(0);animation-timing-function:cubic-bezier(.15,.6,.45,1)}37%{transform:translateY(-92px);animation-timing-function:cubic-bezier(.55,0,.85,.36)}53%{transform:translateY(0);animation-timing-function:cubic-bezier(.15,.6,.45,1)}64.5%{transform:translateY(-48px);animation-timing-function:cubic-bezier(.55,0,.85,.36)}76%{transform:translateY(0);animation-timing-function:cubic-bezier(.15,.6,.45,1)}84%{transform:translateY(-22px);animation-timing-function:cubic-bezier(.55,0,.85,.36)}91%{transform:translateY(0);animation-timing-function:cubic-bezier(.15,.6,.45,1)}95.5%{transform:translateY(-8px);animation-timing-function:cubic-bezier(.55,0,.85,.36)}100%{transform:translateY(0)}}
@keyframes resRise{0%{transform:translateY(28px)}100%{transform:translateY(0)}}
@keyframes resIn{0%{opacity:0;transform:scale(.5)}60%{opacity:.9;transform:scale(1.06)}100%{opacity:.9;transform:scale(1)}}
@keyframes resistPulse{0%{opacity:0}30%{opacity:.55}70%{opacity:.55}100%{opacity:0}}
@keyframes glowPulse{0%{opacity:0}40%{opacity:.5}100%{opacity:.16}}
@keyframes cultureGrow{0%{opacity:0;transform:scale(.12)}55%{opacity:1;transform:scale(1.05)}80%{transform:scale(.98)}100%{opacity:1;transform:scale(1)}}
@keyframes fillFade{0%{fill-opacity:1}100%{fill-opacity:0}}
@keyframes fadeIn{to{opacity:1}}
@keyframes diagramOut{0%{opacity:1}100%{opacity:0}}
@keyframes logoIn{0%{opacity:0;transform:scale(.92)}60%{opacity:1;transform:scale(1)}100%{opacity:1;transform:scale(1)}}
.hint{position:fixed;bottom:18px;left:0;right:0;text-align:center;color:#6f8791;font-size:.8rem}
@media(prefers-reduced-motion:reduce){.anim *{animation:none!important}.anim .diagram{opacity:0}.anim .logo{opacity:1}}
</style></head>
